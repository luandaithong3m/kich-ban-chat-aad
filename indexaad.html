<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Kịch bản chat – Chăm sóc xe 3M | Đại Thống</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#f3f1ed; --card:#fff; --ink:#18181b; --muted:#6b6b72; --line:#e7e3dc;
  --accent:#d0102e; --accent2:#ff5a3c; --accent-soft:#fff0ef; --accent-ink:#a30c25;
  --ok:#17935a; --blue:#2f6fed; --r:16px;
}
*{box-sizing:border-box}
body{margin:0;font-family:"Be Vietnam Pro",system-ui,sans-serif;background:var(--bg);color:var(--ink);font-size:15px;line-height:1.55}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer}

/* ---------- hero ---------- */
.hero{background:radial-gradient(1200px 300px at 85% -40%,rgba(255,90,60,.55),transparent 60%),linear-gradient(120deg,#17171c 0%,#2a1218 55%,#7a0d1f 100%);color:#fff;position:relative;overflow:hidden}
.hero::after{content:"";position:absolute;inset:0;background:repeating-linear-gradient(135deg,rgba(255,255,255,.035) 0 2px,transparent 2px 14px);pointer-events:none}
.hero-in{max-width:1300px;margin:0 auto;padding:22px 24px 18px;display:flex;flex-wrap:wrap;gap:16px 28px;align-items:center;justify-content:space-between;position:relative;z-index:1}
.brand{display:flex;gap:14px;align-items:center}
.logo{width:48px;height:48px;border-radius:14px;background:linear-gradient(135deg,var(--accent),var(--accent2));display:grid;place-items:center;font-weight:800;font-size:18px;box-shadow:0 6px 20px rgba(208,16,46,.45)}
.brand h1{margin:0;font-size:22px;letter-spacing:-.015em}
.brand p{margin:1px 0 0;font-size:13.5px;opacity:.75}
.settings{display:flex;flex-wrap:wrap;gap:8px;background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.14);padding:8px;border-radius:14px;backdrop-filter:blur(6px)}
.settings label{display:flex;flex-direction:column;font-size:11px;opacity:.85;font-weight:500;padding-left:2px}
.settings input{border:1px solid rgba(255,255,255,.18);background:rgba(0,0,0,.25);color:#fff;border-radius:9px;padding:6px 10px;width:150px;margin-top:3px}
.settings input::placeholder{color:rgba(255,255,255,.45)}
.settings input:focus{outline:none;border-color:var(--accent2)}
.modes{max-width:1300px;margin:0 auto;padding:0 24px;display:flex;gap:6px;position:relative;z-index:1}
.mode{border:none;background:transparent;color:rgba(255,255,255,.7);padding:10px 16px 12px;border-radius:12px 12px 0 0;font-weight:600;font-size:14px;display:flex;gap:8px;align-items:center}
.mode:hover{color:#fff}
.mode.on{background:var(--bg);color:var(--ink)}
.mode .n{background:rgba(255,255,255,.18);border-radius:999px;font-size:11px;padding:1px 7px}
.mode.on .n{background:var(--accent);color:#fff}

/* ---------- layout ---------- */
.wrap{max-width:1300px;margin:0 auto;padding:18px 24px 36px;display:grid;grid-template-columns:350px 1fr;gap:20px}
@media(max-width:900px){.wrap{grid-template-columns:1fr;padding:14px}.hero-in{padding:16px 14px}.modes{padding:0 10px}.mode{padding:9px 10px 11px;font-size:12.5px;white-space:nowrap}.mode .n{display:none}}
aside{display:flex;flex-direction:column;gap:12px}
.search{border:1px solid var(--line);background:#fff;border-radius:12px;padding:10px 14px;width:100%}
.search:focus{outline:2px solid var(--accent-soft);border-color:var(--accent)}
.filters{display:flex;gap:6px;flex-wrap:wrap}
.chip{border:1px solid var(--line);background:#fff;border-radius:999px;padding:5px 12px;font-size:13px;font-weight:500}
.chip.on{background:var(--ink);color:#fff;border-color:var(--ink)}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.pcard{position:relative;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:10px 10px 10px;text-align:left;display:flex;flex-direction:column;gap:6px;transition:transform .15s,box-shadow .15s,border-color .15s;overflow:hidden}
.pcard:hover{transform:translateY(-2px);box-shadow:0 8px 20px rgba(0,0,0,.06)}
.pcard.on{border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft)}
.pcard .art{height:74px;border-radius:10px;display:grid;place-items:center;position:relative}
.pcard .art svg{height:64px}
.pcard .tag{position:absolute;top:6px;left:6px;font-size:10.5px;font-weight:700;background:rgba(255,255,255,.85);padding:1px 7px;border-radius:999px}
.pcard .nm{font-weight:600;font-size:13px;line-height:1.3;min-height:34px}
.pcard .pr{font-weight:800;color:var(--accent);font-size:14px}
.sec{font-size:11.5px;text-transform:uppercase;letter-spacing:.07em;color:var(--muted);font-weight:700;margin:8px 2px 0}
.combo{background:linear-gradient(135deg,#fff,#fff6f3);border:1px solid var(--line);border-radius:14px;padding:12px;text-align:left;display:flex;gap:10px;align-items:center;width:100%;transition:transform .15s}
.combo:hover{transform:translateY(-2px)}
.combo.on{border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft)}
.combo .ic{display:flex}
.combo .ic span{width:26px;height:26px;border-radius:8px;border:2px solid #fff;margin-left:-8px;display:grid;place-items:center}
.combo .ic span:first-child{margin-left:0}
.combo .ic svg{height:20px}
.combo b{font-size:14px;display:block}
.combo small{color:var(--muted);font-size:12px}
.combo .tot{margin-left:auto;font-weight:800;color:var(--accent);white-space:nowrap}
.sitg{display:flex;flex-direction:column;gap:6px}
.sit{display:flex;gap:10px;align-items:center;background:#fff;border:1px solid var(--line);border-radius:12px;padding:10px 12px;text-align:left;width:100%;transition:transform .15s}
.sit:hover{transform:translateX(3px)}
.sit.on{border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft)}
.sit .em{width:34px;height:34px;border-radius:10px;display:grid;place-items:center;font-size:17px;flex:none}
.sit b{font-size:14px;font-weight:600;display:block;line-height:1.25}
.sit small{color:var(--muted);font-size:12px}

/* ---------- main ---------- */
main{background:var(--card);border:1px solid var(--line);border-radius:var(--r);display:flex;flex-direction:column;overflow:hidden;min-height:680px}
.phead{padding:18px 20px 16px;border-bottom:1px solid var(--line);display:flex;gap:16px;align-items:flex-start}
.phead .big{flex:none;width:86px;height:96px;border-radius:14px;display:grid;place-items:center}
.phead .big svg{height:82px}
.phead .tx{flex:1;min-width:0}
.phead h2{margin:0;font-size:19px;line-height:1.3;letter-spacing:-.01em}
.sub{color:var(--muted);font-size:13.5px;margin-top:3px;display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.pill{background:#f2efea;border-radius:999px;padding:1px 9px;font-size:12px;font-weight:500;color:var(--ink)}
.price{background:var(--accent);color:#fff;border-radius:999px;padding:1px 10px;font-weight:700;font-size:13px}
.tabs{display:flex;gap:6px;margin-top:12px;flex-wrap:wrap}
.tab{border:1px solid var(--line);background:#fff;border-radius:10px;padding:5px 12px;font-size:13px;font-weight:600;display:flex;gap:6px;align-items:center}
.tab.on.t-uses{background:#eaf7ef;border-color:#bfe6cf;color:#136c43}
.tab.on.t-steps{background:#eaf1ff;border-color:#c7d8fb;color:#1d4fb8}
.tab.on.t-notes{background:#fff5e5;border-color:#f6d9a6;color:#93560a}
.info{margin-top:10px;border-radius:12px;padding:12px 14px 12px 16px;font-size:14px;position:relative;border-left:4px solid}
.info.t-uses{background:#f4fbf7;border-color:#2bb673}
.info.t-steps{background:#f4f7ff;border-color:var(--blue)}
.info.t-notes{background:#fffaf1;border-color:#f0a020}
.info ul,.info ol{margin:0;padding-left:20px;padding-right:70px}
.info li{margin:3px 0}
.info .cp{position:absolute;top:10px;right:10px}
.ctx{display:flex;gap:8px;align-items:center;font-size:13px;color:var(--muted);margin-top:8px;flex-wrap:wrap}
.ctx select{border:1px solid var(--line);border-radius:9px;padding:5px 8px;background:#fff;font-size:13px;max-width:100%}

.thread{flex:1;overflow-y:auto;padding:20px;display:flex;flex-direction:column;gap:14px;max-height:62vh;min-height:300px;
  background:#f7f5f1 radial-gradient(circle at 1px 1px,#e8e3da 1px,transparent 0) 0 0/18px 18px}
.msg{display:flex;gap:8px;max-width:86%;animation:pop .28s ease-out}
@keyframes pop{from{opacity:0;transform:translateY(8px) scale(.98)}to{opacity:1;transform:none}}
.msg.kh{align-self:flex-start}
.msg.me{align-self:flex-end;flex-direction:row-reverse}
.av{flex:none;width:32px;height:32px;border-radius:50%;display:grid;place-items:center;font-size:13px;font-weight:700;color:#fff;margin-top:18px}
.kh .av{background:#8e8e96}
.me .av{background:linear-gradient(135deg,var(--accent),var(--accent2))}
.col{display:flex;flex-direction:column;gap:4px;min-width:0}
.me .col{align-items:flex-end}
.who{font-size:11.5px;color:var(--muted);font-weight:500;display:flex;gap:6px;align-items:center}
.lbl{background:var(--ink);color:#fff;border-radius:999px;padding:0 8px;font-size:10.5px;font-weight:700;letter-spacing:.02em}
.bub{padding:10px 14px;border-radius:18px;white-space:pre-wrap;word-wrap:break-word;box-shadow:0 1px 1px rgba(0,0,0,.04)}
.kh .bub{background:#fff;border-top-left-radius:6px}
.kh .bub.sys{background:transparent;box-shadow:none;border:1px dashed #cfc9bf;color:var(--muted);font-style:italic;font-size:13.5px}
.me .bub{background:linear-gradient(135deg,#ff3b4f,#d0102e);color:#fff;border-top-right-radius:6px;outline:none}
.me .bub:focus{box-shadow:0 0 0 3px rgba(208,16,46,.25)}
.row{display:flex;gap:8px;align-items:center}
.hint{font-size:11.5px;color:var(--muted)}
.cp{border:1px solid var(--line);background:#fff;border-radius:999px;padding:4px 12px;font-size:12.5px;font-weight:700;display:inline-flex;gap:5px;align-items:center;transition:.15s}
.cp:hover{border-color:var(--accent);color:var(--accent)}
.cp.done{background:var(--ok);border-color:var(--ok);color:#fff}
.typing{align-self:flex-end;display:flex;gap:4px;padding:12px 14px;background:#fff;border-radius:18px;margin-right:40px}
.typing i{width:7px;height:7px;border-radius:50%;background:#c4bfb6;animation:b 1s infinite}
.typing i:nth-child(2){animation-delay:.15s}.typing i:nth-child(3){animation-delay:.3s}
@keyframes b{0%,60%,100%{transform:none;opacity:.5}30%{transform:translateY(-4px);opacity:1}}
.ph{background:#ffe27a;color:#18181b;border-radius:4px;padding:0 3px}

.quick{padding:12px 20px 4px;display:flex;gap:6px;flex-wrap:wrap;border-top:1px solid var(--line);background:#fff}
.q{border:1px solid var(--line);background:#fff;border-radius:999px;padding:6px 12px;font-size:13px;font-weight:500;transition:.15s}
.q:hover{border-color:var(--accent);color:var(--accent);transform:translateY(-1px)}
.q.hot{background:var(--accent-soft);border-color:#f5c3c8;color:var(--accent-ink)}
form{display:flex;gap:8px;padding:10px 20px 16px;background:#fff}
form input{flex:1;border:1px solid var(--line);border-radius:999px;padding:11px 16px;background:#faf9f7}
form input:focus{outline:2px solid var(--accent-soft);border-color:var(--accent);background:#fff}
form button{border:none;background:linear-gradient(135deg,var(--accent2),var(--accent));color:#fff;border-radius:999px;padding:0 20px;font-weight:700}
.clear{background:none;border:none;color:var(--muted);font-size:12.5px;text-decoration:underline;padding:0 4px;margin-left:auto}
.toast{position:fixed;bottom:22px;left:50%;transform:translateX(-50%) translateY(20px);background:var(--ink);color:#fff;padding:10px 18px;border-radius:999px;font-size:13.5px;opacity:0;transition:.2s;pointer-events:none;box-shadow:0 8px 24px rgba(0,0,0,.2)}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
</style>
</head>
<body>
<div class="hero">
  <div class="hero-in">
    <div class="brand">
      <div class="logo">3M</div>
      <div><h1>Kịch bản chat chăm sóc xe 3M</h1><p>Chọn sản phẩm hoặc tình huống → bấm câu khách hỏi → sửa nếu cần → Copy gửi khách</p></div>
    </div>
    <div class="settings">
      <label>Tên shop<input id="sShop" placeholder="Đại Thống"></label>
      <label>Người tư vấn<input id="sTen" placeholder="VD: Linh"></label>
      <label>SĐT / Zalo<input id="sSdt" placeholder="VD: 09xx xxx xxx"></label>
    </div>
  </div>
  <div class="modes" id="modes"></div>
</div>

<div class="wrap">
  <aside id="side"></aside>
  <main>
    <div class="phead" id="phead"></div>
    <div class="thread" id="thread"></div>
    <div class="quick" id="quick"></div>
    <form id="ask">
      <input id="askIn" placeholder="Dán câu khách hỏi: “xài sao shop?”, “mắc vậy”, “để mình suy nghĩ”…" autocomplete="off">
      <button type="submit">Trả lời ➤</button>
    </form>
  </main>
</div>
<div class="toast" id="toast">✓ Đã copy, dán vào khung chat với khách</div>

/* ================= SETTINGS ================= */
const S = {shop:"", ten:"", sdt:""};
try{ Object.assign(S, JSON.parse(localStorage.getItem("kb3m")||"{}")); }catch(e){}
[["sShop","shop"],["sTen","ten"],["sSdt","sdt"]].forEach(([el,k])=>{
  const i=$(el); i.value=S[k]||"";
  i.addEventListener("input",()=>{ S[k]=i.value.trim(); try{localStorage.setItem("kb3m",JSON.stringify(S))}catch(e){} });
});
const shop = () => S.shop || "Đại Thống";
const sdt = () => S.sdt || "[SĐT/Zalo]";
const fill = (t,p) => t.replace(/\{sp\}/g, p?p.name:"sản phẩm").replace(/\{gia\}/g, p?vnd(p.price):"[giá]")
  .replace(/\{shop\}/g, shop()).replace(/\{sdt\}/g, sdt()).replace(/\{ten\}/g, S.ten||"em").replace(/\{meo\}/g, p?p.tip:"[mẹo]");

/* ================= PRODUCT ANSWERS ================= */
const A = {
  hello: p => `Dạ ${shop()} xin chào anh/chị ạ!${S.ten?` Em là ${S.ten}, rất vui được hỗ trợ mình.`:""} Anh/chị đang quan tâm sản phẩm chăm sóc xe nào để em tư vấn kỹ hơn ạ?`,
  uses: p => p.pitch + "\n\n" + p.uses.map(u=>"✔ "+u).join("\n"),
  price: p => `Dạ ${p.name} (${p.vol}) bên em đang có giá ${vnd(p.price)}/chai ạ.` + (p.pair.length?`\nNếu mình dùng kèm ${p.pair.map(i=>byId(i).short.toLowerCase()).join(" hoặc ")} thì hiệu quả hơn, em báo giá luôn cho anh/chị nha.`:"") + `\nAnh/chị lấy mấy chai để em lên đơn ạ?`,
  steps: p => `Dạ cách dùng ${p.name} rất đơn giản ạ:\n` + p.steps.map((s,i)=>`${i+1}. ${s}`).join("\n"),
  notes: p => `Dạ khi dùng ${p.name} anh/chị lưu ý giúp em:\n` + p.notes.map(n=>"• "+n).join("\n") + `\nDùng đúng cách thì rất an toàn cho xe ạ.`,
  genuine: p => `Dạ sản phẩm bên em là hàng 3M chính hãng, nguồn gốc rõ ràng ạ. ${shop()} chuyên phân phối sản phẩm 3M cho các garage và đại lý, anh/chị hoàn toàn yên tâm sử dụng ạ.`,
  pair: p => `Dạ dùng ${p.name} thì anh/chị nên kết hợp thêm:\n` + p.pair.map(i=>{const q=byId(i);return `• ${q.name} – ${vnd(q.price)}`}).join("\n") + `\nKết hợp như vậy xe sẽ sạch và đẹp lâu hơn ạ. Anh/chị muốn em gom thành combo không ạ?`,
  order: p => `Dạ để đặt hàng, anh/chị gửi giúp em:\n• Họ tên người nhận\n• Số điện thoại\n• Địa chỉ nhận hàng\n• Số lượng ${p.name}\nEm lên đơn và báo phí ship cho mình ngay ạ. Cần tư vấn thêm, anh/chị gọi hoặc Zalo em: ${sdt()}.`,
  close: p => `Dạ em xác nhận đơn của anh/chị: ${p.name} (${p.vol}) – ${vnd(p.price)}/chai. Em sẽ đóng gói và gửi đi sớm nhất, có gì cần hỗ trợ anh/chị nhắn em hoặc gọi ${sdt()} nha. Cảm ơn anh/chị đã tin dùng sản phẩm 3M tại ${shop()} ạ!`
};
const QUICK = [["hello","👋 Chào khách"],["uses","✨ Công dụng?"],["price","💰 Giá bao nhiêu?"],["steps","🧴 Dùng sao?"],["notes","⚠️ Có hại xe không?"],["genuine","🛡️ Chính hãng không?"],["pair","➕ Mua kèm gì?"],["@sdt","📞 Xin SĐT"],["@zalo","💬 Xin Zalo"],["order","📦 Đặt hàng"],["close","✅ Chốt đơn"]];
const QLABEL = {hello:"(Khách vừa nhắn tin)",uses:"Sản phẩm này dùng để làm gì vậy?",price:"Bao nhiêu 1 chai vậy shop?",steps:"Xài sao vậy shop?",notes:"Xài có hại sơn/xe không?",genuine:"Hàng chính hãng không shop?",pair:"Mua thêm gì cho đủ bộ?",order:"Đặt sao shop, có ship không?",close:"Ok lấy cho mình nha."};
const INTENTS = [
  ["@dat",["dat qua","dat vay","dat the","dat ghe","mac qua","mac vay","mac the","mac ghe"," mac "]],
  ["@rehon",["re hon","cho khac","noi khac","ben kia","shop khac","giam gia"]],
  ["@suynghi",["suy nghi","de xem","tham khao","can nhac","de minh xem"]],
  ["@desau",["de sau","khi nao can","bua khac","hom khac","lan sau","chua can"]],
  ["genuine",["chinh hang","hang that","hang gia","fake","nguon goc","xuat xu","hang nhai"]],
  ["price",["gia","bao nhieu","nhieu tien"," bn ","bao tien"]],
  ["steps",["xai sao","dung sao","dung the nao","cach dung","huong dan","su dung","xai the nao","lam sao"]],
  ["notes",["hai","hu son","hong","an toan","luu y","tray","co sao khong","doc"]],
  ["pair",["kem","combo","them gi","du bo","ket hop"]],
  ["order",["dat hang","dat sao","dat mua","muon dat","len don","ship","giao","cod","dia chi","lay cho","lay 1","lay 2"]],
  ["hello",["chao","alo","hello","hi shop","shop oi"]],
  ["uses",["cong dung","tac dung","de lam gi","lam gi","tot khong","hieu qua","co tot"]]
];
const detect = text => { const t=" "+norm(text)+" "; for(const [k,ws] of INTENTS) if(ws.some(w=>t.includes(w))) return k; return "uses"; };
function detectProduct(text){ const t=" "+norm(text)+" "; let best=null,len=0;
  P.forEach(p=>p.keys.forEach(k=>{ if(t.includes(" "+k)&&k.length>len){best=p;len=k.length;} })); return best; }

/* ================= STATE / UI ================= */
let mode="sp", cur=P[0], combo=0, sit=SITS[0], filter="Tất cả", tab="uses", busy=Promise.resolve();

function renderModes(){
  const m=[["sp","🧴 Theo sản phẩm",P.length],["sit","📞 Xin SĐT & chăm khách",SITS.length],["combo","🎁 Combo",COMBOS.length]];
  $("modes").innerHTML=m.map(([k,l,n])=>`<button class="mode ${k===mode?"on":""}" data-m="${k}">${l}<span class="n">${n}</span></button>`).join("");
  $("modes").querySelectorAll(".mode").forEach(b=>b.onclick=()=>{mode=b.dataset.m; render(true);});
}
function renderSide(){
  if(mode==="sp"){
    const q=norm(($("search")||{}).value||"");
    const items=P.filter(p=>(filter==="Tất cả"||p.cat===filter)&&(!q||norm(p.name+" "+p.code+" "+p.keys.join(" ")).includes(q)));
    const hadSearch=$("search");
    if(!hadSearch){
      $("side").innerHTML=`<input class="search" id="search" placeholder="🔍 Tìm: lốp, kính, nỉ, keo…"><div class="filters" id="filters"></div><div class="grid" id="grid"></div>`;
      $("search").oninput=renderSide;
    }
    $("filters").innerHTML=["Tất cả","Nội thất","Ngoại thất","Kính"].map(c=>`<button class="chip ${c===filter?"on":""}" data-c="${c}">${c}</button>`).join("");
    $("filters").querySelectorAll(".chip").forEach(b=>b.onclick=()=>{filter=b.dataset.c;renderSide();});
    $("grid").innerHTML=items.map(p=>`<button class="pcard ${p===cur?"on":""}" data-id="${p.id}">
      <div class="art" style="background:${p.tint}"><span class="tag">${p.cat}</span>${bottle(p,64)}</div>
      <div class="nm">${p.short}</div><div class="pr">${vnd(p.price)}</div></button>`).join("") || `<div class="hint" style="padding:8px">Không tìm thấy sản phẩm.</div>`;
    $("grid").querySelectorAll(".pcard").forEach(b=>b.onclick=()=>{cur=byId(+b.dataset.id); render(true); scrollMain();});
  } else if(mode==="combo"){
    $("side").innerHTML=COMBOS.map((c,i)=>{const t=c.ids.reduce((s,id)=>s+byId(id).price,0);
      return `<button class="combo ${i===combo?"on":""}" data-i="${i}"><div class="ic">${c.ids.map(id=>{const p=byId(id);return `<span style="background:${p.tint}">${bottle(p,20)}</span>`}).join("")}</div>
      <div><b>${c.name}</b><small>${c.ids.length} sản phẩm</small></div><span class="tot">${vnd(t)}</span></button>`}).join("");
    $("side").querySelectorAll(".combo").forEach(b=>b.onclick=()=>{combo=+b.dataset.i; render(true); scrollMain();});
  } else {
    $("side").innerHTML=SIT.map(g=>`<div class="sec" style="color:${g.color}">${g.group}</div><div class="sitg">${g.items.map(i=>
      `<button class="sit ${i.id===sit.id?"on":""}" data-s="${i.id}"><span class="em" style="background:${g.bg}">${i.em}</span><span><b>${i.t}</b><small>${esc(i.d)}</small></span></button>`).join("")}</div>`).join("");
    $("side").querySelectorAll(".sit").forEach(b=>b.onclick=()=>{sit=SITS.find(s=>s.id===b.dataset.s); render(true); scrollMain();});
  }
}
function prodSelect(){
  return `<div class="ctx">Đang nói về sản phẩm: <select id="ctxSel">${P.map(p=>`<option value="${p.id}" ${p===cur?"selected":""}>${p.short} – ${vnd(p.price)}</option>`).join("")}</select></div>`;
}
function renderHead(){
  if(mode==="sp"){
    const p=cur, L={uses:["✨ Công dụng",p.uses,"ul"],steps:["🧴 Cách dùng",p.steps,"ol"],notes:["⚠️ Lưu ý",p.notes,"ul"]}, [ttl,arr,tag]=L[tab];
    $("phead").innerHTML=`<div class="big" style="background:${p.tint}">${bottle(p,82)}</div><div class="tx">
      <h2>${p.name}</h2><div class="sub"><span class="price">${vnd(p.price)}</span><span class="pill">${p.vol}</span>${p.code?`<span class="pill">Mã ${p.code}</span>`:""}<span class="pill">${p.cat}</span></div>
      <div class="tabs">${Object.entries(L).map(([k,v])=>`<button class="tab t-${k} ${k===tab?"on":""}" data-t="${k}">${v[0]}</button>`).join("")}</div>
      <div class="info t-${tab}"><button class="cp" id="cpInfo">⧉ Copy</button><${tag}>${arr.map(x=>`<li>${x}</li>`).join("")}</${tag}></div></div>`;
    $("phead").querySelectorAll(".tab").forEach(b=>b.onclick=()=>{tab=b.dataset.t;renderHead();});
    $("cpInfo").onclick=e=>copy(ttl.replace(/^\S+\s/,"")+" – "+p.name+":\n"+arr.map((x,i)=>(tag==="ol"?(i+1)+". ":"• ")+x).join("\n"), e.currentTarget);
  } else if(mode==="combo"){
    const c=COMBOS[combo], t=c.ids.reduce((s,id)=>s+byId(id).price,0);
    $("phead").innerHTML=`<div class="big" style="background:linear-gradient(135deg,#fff3ef,#ffe1dc)"><div style="display:flex">${c.ids.slice(0,3).map(id=>bottle(byId(id),58)).join("")}</div></div>
      <div class="tx"><h2>🎁 ${c.name}</h2><div class="sub"><span class="price">${vnd(t)}</span><span class="pill">${c.ids.length} sản phẩm · tổng giá lẻ</span></div>
      <div class="info t-uses"><ul>${c.ids.map(i=>{const p=byId(i);return `<li>${p.name} – <b>${vnd(p.price)}</b></li>`}).join("")}</ul></div></div>`;
  } else {
    $("phead").innerHTML=`<div class="big" style="background:${sit.g.bg};font-size:44px">${sit.em}</div><div class="tx">
      <h2>${sit.t}</h2><div class="sub"><span class="pill" style="background:${sit.g.bg};color:${sit.g.color};font-weight:700">${sit.g.group}</span><span>${esc(sit.d)}</span></div>
      ${prodSelect()}</div>`;
    $("ctxSel").onchange=e=>{cur=byId(+e.target.value); render(true);};
  }
}
function renderQuick(){
  let h="";
  if(mode==="sp") h=QUICK.map(([k,l])=>`<button class="q ${k.startsWith("@")?"hot":""}" data-k="${k}">${l}</button>`).join("");
  else if(mode==="combo") h=`<button class="q" data-k="combo">🎁 Giới thiệu combo</button><button class="q hot" data-k="@sdt">📞 Xin SĐT</button><button class="q hot" data-k="@zalo">💬 Xin Zalo</button><button class="q" data-k="corder">📦 Đặt combo</button>`;
  else h=SIT.map(g=>g.items.filter(i=>i.id!==sit.id).slice(0,2).map(i=>`<button class="q" data-k="@${i.id}">${i.em} ${i.t}</button>`).join("")).join("");
  $("quick").innerHTML=h+`<button class="clear" id="clr">Xoá hội thoại</button>`;
  $("quick").querySelectorAll(".q").forEach(b=>b.onclick=()=>respond(b.dataset.k));
  $("clr").onclick=()=>{$("thread").innerHTML="";};
}
function scrollMain(){ if(innerWidth<900) document.querySelector("main").scrollIntoView({behavior:"smooth"}); }

/* ================= CHAT ================= */
function addKh(text){
  const d=document.createElement("div"); d.className="msg kh";
  const sys=text.startsWith("(");
  d.innerHTML=`<div class="av">KH</div><div class="col"><span class="who">Khách</span><div class="bub ${sys?"sys":""}"></div></div>`;
  d.querySelector(".bub").textContent=sys?text.slice(1,-1):text;
  $("thread").appendChild(d); $("thread").scrollTop=$("thread").scrollHeight;
}
async function addMe(text, label){
  const ty=document.createElement("div"); ty.className="typing"; ty.innerHTML="<i></i><i></i><i></i>";
  $("thread").appendChild(ty); $("thread").scrollTop=$("thread").scrollHeight;
  await sleep(380); ty.remove();
  const d=document.createElement("div"); d.className="msg me";
  d.innerHTML=`<div class="av">${esc((shop()[0]||"S").toUpperCase())}</div><div class="col"><span class="who">${label?`<span class="lbl">${esc(label)}</span>`:""}Trả lời mẫu · ${esc(shop())}</span>
    <div class="bub" contenteditable="true" spellcheck="false"></div><div class="row"><span class="hint">✎ Bấm vào để sửa</span><button class="cp">⧉ Copy</button></div></div>`;
  const b=d.querySelector(".bub"); b.textContent=text;
  b.innerHTML=b.innerHTML.replace(/\[([^\]]{1,20})\]/g,'<span class="ph">[$1]</span>');
  d.querySelector(".cp").onclick=e=>copy(b.innerText.trim(), e.currentTarget);
  $("thread").appendChild(d); $("thread").scrollTop=$("thread").scrollHeight;
}
function comboText(k){
  const c=COMBOS[combo], t=c.ids.reduce((s,id)=>s+byId(id).price,0);
  if(k==="combo") return `Dạ anh/chị tham khảo ${c.name.toLowerCase()} bên em nha 🎁\n`+c.ids.map(i=>{const p=byId(i);return `• ${p.name} (${p.vol}) – ${vnd(p.price)}`}).join("\n")+`\nTổng: ${vnd(t)}.\nBộ này ${c.why} ạ. Anh/chị lấy trọn bộ để em lên đơn luôn nha?`;
  return `Dạ anh/chị gửi giúp em họ tên, số điện thoại, địa chỉ nhận hàng, em lên đơn ${c.name.toLowerCase()} (${vnd(t)}) và báo phí ship cho mình ngay ạ. Cần tư vấn thêm anh/chị gọi hoặc Zalo em: ${sdt()}.`;
}
function respond(k, raw){
  busy = busy.then(async()=>{
    if(k.startsWith("@")){
      const s=SITS.find(x=>x.id===k.slice(1));
      addKh(raw || s.kh);
      let ctx=cur;
      if(mode==="combo"){ const c=COMBOS[combo]; ctx={name:c.name.toLowerCase(), price:c.ids.reduce((x,id)=>x+byId(id).price,0), tip:byId(c.ids[0]).tip}; }
      for(const [lbl,txt] of s.v) await addMe(fill(txt, ctx), lbl);
      return;
    }
    if(mode==="combo"){ addKh(raw || (k==="combo"?"Có bộ nào đủ dùng không shop?":"Đặt combo sao shop?")); await addMe(comboText(k)); return; }
    addKh(raw || QLABEL[k]); await addMe(A[k](cur));
  });
}
function render(reset){
  renderModes(); renderSide(); renderHead(); renderQuick();
  if(reset){ $("thread").innerHTML="";
    if(mode==="sp") respond("uses","(Khách hỏi về "+cur.short.toLowerCase()+")");
    else if(mode==="combo") respond("combo");
    else respond("@"+sit.id);
  }
}
$("ask").onsubmit=e=>{
  e.preventDefault(); const v=$("askIn").value.trim(); if(!v) return;
  const p=detectProduct(v); let k=detect(v);
  if(p && p!==cur){ cur=p; if(mode==="sp"){tab="uses";renderSide();renderHead();} else if(mode==="sit") renderHead(); }
  if(mode==="combo" && !k.startsWith("@")){ mode="sp"; renderModes(); renderSide(); renderHead(); renderQuick(); }
  respond(k, v); $("askIn").value="";
};

async function copy(text, btn){
  let ok=false;
  try{ await navigator.clipboard.writeText(text); ok=true; }catch(e){
    try{ const t=document.createElement("textarea"); t.value=text; document.body.appendChild(t); t.select(); ok=document.execCommand("copy"); t.remove(); }catch(_){}
  }
  if(ok){ const o=btn.innerHTML; btn.innerHTML="✓ Đã copy"; btn.classList.add("done"); setTimeout(()=>{btn.innerHTML=o;btn.classList.remove("done")},1500);
    $("toast").classList.add("show"); setTimeout(()=>$("toast").classList.remove("show"),1500); }
  else btn.textContent="Bôi đen & copy tay";
}
render(true);
</script>
</body>
</html>
